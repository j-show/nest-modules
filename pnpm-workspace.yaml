packages:
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  esbuild: true

catalog:
  '@types/node': '^22'
  '@jshow/logger': ^1.0.14
  '@nestjs/core': ^11
  '@nestjs/common': ^11
  '@nestjs/cli': ^11
  '@nestjs/testing': ^11
  '@nestjs/platform-fastify': ^11
  '@nestjs/config': ^4
  tslib: latest
  debug: latest
  'reflect-metadata': latest
  fastify: ^5
  ioredis: ^5
  chalk: ^5.6.2
  dayjs: ^1
  'lodash-es': ^4.18.1

overrides:
  '@jshow/logger': 'catalog:'
  tslib: 'catalog:'
  dayjs: 'catalog:'
